name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  report:
    # Runs the real pipeline on the bundled database (no credentials needed) and keeps the output as a downloadable artifact.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m sakila_reporting --as-of 2005-08-20   # first run on a fresh workbook
      - run: python -m sakila_reporting --as-of 2005-08-24   # catches up on the days the first run did not cover
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-and-csv
          path: output/
